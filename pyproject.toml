[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-bus"
version = "0.1.0"
description = "Local-first message bus for AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-bus = "buslib.cli:main"
agent-bus-daemon = "buslib.daemon.server:main"
agent-bus-notifier = "buslib.notifier:main"

[tool.setuptools.packages.find]
include = ["buslib*"]
