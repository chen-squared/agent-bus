name: ci

on:
  push:
  pull_request:

jobs:
  probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python3 -m compileall -q bus.py buslib bus_agent.py bus_daemon.py bus_ssh_gateway.py probe_*.py
      - name: Shell syntax
        run: bash -n bus_wake.sh
      - name: Pyflakes
        run: |
          python3 -m pip install --quiet pyflakes
          python3 -m pyflakes buslib/*.py buslib/adapters/*.py buslib/daemon/*.py bus_agent.py bus_daemon.py bus_ssh_gateway.py
      - name: Package install smoke
        run: |
          python3 -m pip install --quiet --no-deps .
          agent-bus --help >/dev/null
          agent-bus-daemon --help >/dev/null
          agent-bus-notifier --help >/dev/null
      - name: Group gates probe
        run: python3 probe_group_gates.py
      - name: Group digest probe
        run: python3 probe_group_digest.py
      - name: Security probe
        run: python3 probe_security.py
      - name: Review regression probe
        run: python3 probe_regressions.py
      - name: Process integration probe
        run: python3 probe_process.py
      - name: Bootstrapping probe
        run: python3 probe_up.py
      - name: Python API probe
        run: python3 probe_api.py
